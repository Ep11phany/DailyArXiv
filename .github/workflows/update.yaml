name: Update

on:
  workflow_dispatch:
    inputs:
      notify:
        description: 'Create the usual paper issue and notify repository subscribers'
        type: boolean
        default: false
  label:
    types:
      - created # for test
  schedule:
      - cron: '0 2 * * 1-5' # 10:00 Beijing time every Monday to Friday (02:00 UTC)

permissions:
  contents: write
  issues: write 

jobs:
  update_daily_papers:
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Keep the runner/Python combination stable when ubuntu-latest moves.
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: python -m pip install -r requirements.txt

    - name: Update papers
      run: |
        python main.py

    - name: Commit and push changes
      uses: github-actions-x/commit@v2.9
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        push-branch: 'master'
        commit-message: '✏️ Update papers automatically.'
        force-add: 'true'
        files: README.md .github/ISSUE_TEMPLATE.md
        name: Meilin Zhu
        email: martial0296@gmail.com

    - name: Create an issue to notify
      if: github.event_name != 'workflow_dispatch' || inputs.notify
      uses: JasonEtco/create-an-issue@v2.9.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
